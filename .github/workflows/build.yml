name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fabric Loom 1.18.2 ships Java 25 bytecode (class file major 69), so an
      # older JDK cannot even resolve the plugin: Gradle fails with a "no
      # matching variant" error before the build starts. Loom also requires
      # Gradle 9.7+, which the committed wrapper pins.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom keeps the decompiled and remapped Minecraft jars outside the
      # normal dependency cache. Without this every run re-downloads and
      # re-remaps Minecraft, which is by far the slowest part of the build.
      - name: Cache Loom's Minecraft artifacts
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fabric-loom
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: filc-mod
          path: build/libs/*.jar
          retention-days: 30
