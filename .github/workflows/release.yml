name: release

# Releases are cut by pushing a version tag, not by pushing to main. The mod
# version is baked into fabric.mod.json, so every release needs its own number
# and a release per commit would produce a pile of colliding 1.0-SNAPSHOTs.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag is the single source of truth: gradle.properties keeps saying
# 1.0-SNAPSHOT and the build overrides it with -Pmod_version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated by diffing against the previous tag,
          # which a shallow clone does not have.
          fetch-depth: 0

      # Fabric Loom 1.18.2 ships Java 25 bytecode, so an older JDK cannot even
      # resolve the plugin. See .github/workflows/build.yml.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Loom's Minecraft artifacts
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fabric-loom
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: loom-${{ runner.os }}-

      # Inputs reach the shell through the environment rather than ${{ }}
      # interpolation, so a tag name can never be spliced into the script.
      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Tolerate someone typing the leading v in the dispatch box.
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            tag="$TAG_NAME"
            version="${tag#v}"
          fi

          if ! printf '%s' "$version" \
              | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a semantic version (expected 1.2.3 or 1.2.3-rc1)"
            exit 1
          fi

          # A hyphen means a pre-release: v1.0.0-rc1 must not be marked latest.
          if printf '%s' "$version" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $tag"

      - name: Build and test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION" --stacktrace

      # A jar whose manifest disagrees with the tag would be installed under the
      # wrong version by every launcher, so check before publishing.
      - name: Verify the built jar carries the release version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/libs/filc-mod-$VERSION.jar"
          test -f "$jar" || { echo "::error::$jar was not produced"; exit 1; }
          declared=$(unzip -p "$jar" fabric.mod.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::fabric.mod.json says $declared but the tag says $VERSION"
            exit 1
          fi
          echo "fabric.mod.json version = $declared"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--generate-notes --target "$GITHUB_SHA")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)

          gh release create "$TAG" \
            "build/libs/filc-mod-$VERSION.jar" \
            "build/libs/filc-mod-$VERSION-sources.jar" \
            --title "Filc Mod $VERSION" \
            --notes "Client-side Fabric mod for **Minecraft 1.21.1**, requires Fabric API.

          Download \`filc-mod-$VERSION.jar\` below and drop it in your \`mods\` folder." \
            "${flags[@]}"
